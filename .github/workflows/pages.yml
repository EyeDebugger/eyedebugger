name: Pages

# Publishes site/ (the project site: one static page, no build step) to GitHub
# Pages at https://eyedbg.izzat.dev. The custom domain and HTTPS live in the
# repository's Pages settings (source: GitHub Actions); an Actions deployment
# ignores a CNAME file, so there is none. The github-pages environment only
# accepts deployments from main. site/README.md covers previewing and editing.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits instead of cancelling one that
# is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the site
        # everything in site/ but its README
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp -R site/. "$RUNNER_TEMP/site/"
          rm "$RUNNER_TEMP/site/README.md"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact
      id-token: write # prove the deployment comes from this workflow (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
