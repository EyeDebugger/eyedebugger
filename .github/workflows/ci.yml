name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch newly published vulnerabilities
  workflow_dispatch:
    inputs:
      e2e-count:
        description: e2e test repeat count (COUNT=5 before merging an e2e change)
        type: choice
        options: ["1", "3", "5"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Toolchain and tool pins. Keep GOLANGCI_LINT_VERSION and GOVULNCHECK_VERSION
  # in sync with Taskfile.yml. go.mod's `go` line is the minimum supported Go.
  GO_VERSION: "1.27.x"
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0
  GORELEASER_VERSION: v2.18.2
  DOTNET_VERSION: "10.0.x"
  PYTHON_VERSION: "3.13"
  # The VS Code extension's toolchain (extensions/vscode): Node Active LTS;
  # pnpm comes from corepack (bundled through Node 24), which downloads the
  # version package.json's packageManager pins and checks its hash.
  NODE_VERSION: "24.x"
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: "1.30.1"

jobs:
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # keep the "1.27.x" entries equal to env.GO_VERSION (env is not available in matrix)
        include:
          - os: ubuntu-latest
            go: "1.27.x"
            race: true
          - os: ubuntu-24.04-arm
            go: "1.27.x"
            race: true
          - os: macos-latest
            go: "1.27.x"
            race: true
          - os: macos-15-intel
            go: "1.27.x"
            race: true
          - os: windows-latest
            go: "1.27.x"
            race: true
          - os: windows-11-arm
            go: "1.27.x"
            race: false # the race detector doesn't support windows/arm64
          - os: ubuntu-latest
            go: "1.26.x" # minimum supported, from go.mod
            race: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Test with race detector
        env:
          RACE: ${{ matrix.race && '-race' || '' }}
        shell: bash
        run: |
          flags=()
          [ -n "$RACE" ] && flags+=("$RACE")
          go test "${flags[@]}" -shuffle=on ./...

  build:
    name: build (6 targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Cross-compile linux, darwin, windows x amd64, arm64
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "::group::${os}/${arch}"
              GOOS="$os" GOARCH="$arch" go build ./...
              echo "::endgroup::"
            done
          done

  # The e2e job's matrix is computed here (rather than written inline) so that
  # on push/pull_request it has exactly one entry (ubuntu-latest) and on
  # workflow_dispatch/schedule it has all six platforms, without ever making
  # the e2e job itself conditionally skipped: a skipped job would fail ci-ok.
  e2e-matrix:
    name: e2e matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Compute matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # netcoredbg has no osx-x64 release (macos-15-intel) or win-arm64 release
          # (windows-11-arm): there the .NET debugger e2e runs with SharpDbg alone
          # (installed on every entry; the driver's default where netcoredbg has no
          # build, docs/adr/0017) — except where SharpDbgWithheld names the platform
          # (windows/arm64), whose .NET debugger e2e then skips. The race detector
          # doesn't support windows/arm64.
          # langs is EYEDBG_E2E_LANGS: "" runs every language (Linux and macOS install
          # lldb-18/xcrun's lldb-dap below); Windows has no lldb-dap story yet, so its
          # entries exclude c, cpp and rust. Delve publishes a windows/amd64 build (so
          # windows-latest adds go, exercising the connect transport's AF_UNIX socket on
          # Windows for the first time) but none for windows/arm64, so windows-11-arm
          # drops go too.
          full='[
            {"os":"ubuntu-latest","netcoredbg":true,"race":true,"langs":""},
            {"os":"ubuntu-24.04-arm","netcoredbg":true,"race":true,"langs":""},
            {"os":"macos-latest","netcoredbg":true,"race":true,"langs":""},
            {"os":"windows-latest","netcoredbg":true,"race":true,"langs":"python,dotnet,go"},
            {"os":"macos-15-intel","netcoredbg":false,"race":true,"langs":""},
            {"os":"windows-11-arm","netcoredbg":false,"race":false,"langs":"python,dotnet"}
          ]'
          reduced=$(jq -c '[.[0]]' <<<"$full")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "include=$(echo "$full" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "include=$reduced" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e (${{ matrix.os }})
    needs: e2e-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EYEDBG_E2E: "1"
      EYEDBG_E2E_NETWORK: "1"
      EYEDBG_E2E_LANGS: ${{ matrix.langs }}
      E2E_COUNT: ${{ inputs.e2e-count || '1' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      # Every entry: the .NET side helper's e2e needs the SDK even where
      # netcoredbg has no build.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lldb-dap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lldb-18
          echo "EYEDBG_LLDB_DAP=/usr/bin/lldb-dap-18" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Find lldb-dap (macOS)
        if: runner.os == 'macOS'
        run: echo "EYEDBG_LLDB_DAP=$(xcrun -f lldb-dap)" >> "$GITHUB_ENV"
      - name: rustc version
        if: runner.os != 'Windows'
        run: rustc --version
      - name: Build eyedbg
        run: |
          go build -o "$RUNNER_TEMP/eyedbg-bin/" ./cmd/...
          echo "EYEDBG_DATA_DIR=$RUNNER_TEMP/eyedbg-data" >> "$GITHUB_ENV"
      - name: Install debugpy
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters install debugpy"
      - name: Install netcoredbg
        if: matrix.netcoredbg
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters install netcoredbg"
      # SharpDbg (docs/adr/0017): opt-in for users, installed here on every
      # entry so both adapters' .NET e2e runs.
      - name: Install SharpDbg
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters install sharpdbg"
      - name: .NET debugger e2e with SharpDbg only
        if: "!matrix.netcoredbg"
        run: |
          echo "::notice title=.NET debugger e2e with SharpDbg only::netcoredbg has no $RUNNER_OS/$RUNNER_ARCH release; the .NET debugger e2e runs with SharpDbg (the default here), netcoredbg's subtests skip"
          echo "netcoredbg has no $RUNNER_OS/$RUNNER_ARCH release: .NET debugger e2e runs with SharpDbg only" >> "$GITHUB_STEP_SUMMARY"
      - name: Install delve
        if: matrix.langs == '' || contains(matrix.langs, 'go')
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters install delve"
      - name: Doctor
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters doctor python"
      - name: Doctor (dotnet)
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters doctor dotnet"
      - name: Doctor (sharpdbg)
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters doctor sharpdbg"
      - name: Doctor (c)
        if: runner.os != 'Windows'
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters doctor c"
      - name: Doctor (go)
        if: matrix.langs == '' || contains(matrix.langs, 'go')
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters doctor go"
      - name: e2e
        env:
          RACE: ${{ matrix.race && '-race' || '' }}
        run: |
          flags=()
          [ -n "$RACE" ] && flags+=("$RACE")
          go test "${flags[@]}" -count="$E2E_COUNT" -p 1 -timeout 50m ./drivers/... ./internal/e2e/...

  # The VS Code extension: checks, the VSIX file list, and the integration
  # suite in real VS Code (1.100.0 and 1.139.0, downloaded and checked against
  # the update server's sha256) against the real eyedbg, debugpy, netcoredbg
  # and the .NET side helper (the .NET views' tests), on every OS on every
  # run. No caches; no secrets.
  extension:
    name: extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          cd extensions/vscode && pnpm --version
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Build eyedbg
        run: |
          go build -trimpath -o "$RUNNER_TEMP/eyedbg-bin/" ./cmd/eyedbg ./cmd/eyedbgd
          echo "EYEDBG_DATA_DIR=$RUNNER_TEMP/eyedbg-data" >> "$GITHUB_ENV"
          echo "EYEDBG_TEST_BIN_DIR=$RUNNER_TEMP/eyedbg-bin" >> "$GITHUB_ENV"
      # Next to eyedbg, where it looks for it (drivers/dotnet/helper.go).
      - name: Publish the .NET helper
        working-directory: helpers/dotnet
        run: dotnet publish src/EyeDbg.DotnetHelper/EyeDbg.DotnetHelper.csproj -c Release -p:RestoreLockedMode=true -o "$RUNNER_TEMP/eyedbg-bin/helpers/dotnet"
      - name: Install debugpy
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters install debugpy"
      - name: Install netcoredbg
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters install netcoredbg"
      - name: Doctor (dotnet)
        run: "\"$RUNNER_TEMP/eyedbg-bin/eyedbg\" adapters doctor dotnet"
      - name: Install dependencies
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: extensions/vscode
        run: pnpm run typecheck
      - name: Lint
        working-directory: extensions/vscode
        run: pnpm run lint
      - name: Unit tests
        working-directory: extensions/vscode
        run: pnpm test
      - name: Package
        working-directory: extensions/vscode
        run: pnpm run package
      - name: Integration tests
        working-directory: extensions/vscode
        run: pnpm run test:integration

  # The .NET side helper (helpers/dotnet, docs/adr/0016): format, analyzers as
  # errors, tests on the helper's floor (.NET 8, DOTNET_ROLL_FORWARD=Minor) and on
  # .NET 10, and the NuGet audit (advisories fail here, not in local builds).
  # Locked restore from nuget.org only; no caches; package build code runs here,
  # never in a job with write permissions.
  helper:
    name: helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: helpers/dotnet
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            ${{ env.DOTNET_VERSION }}
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet run --project tests/EyeDbg.DotnetHelper.Tests -c Release --no-build
      - name: Test on .NET 8 (the floor)
        env:
          DOTNET_ROLL_FORWARD: Minor
        run: |
          set -euo pipefail
          dotnet run --project tests/EyeDbg.DotnetHelper.Tests -c Release --no-build
          hello=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"hello","params":{"protocol":1}}' |
            dotnet src/EyeDbg.DotnetHelper/bin/Release/net8.0/eyedbg-dotnet-helper.dll)
          echo "$hello"
          grep -q '"runtime":".NET 8\.' <<<"$hello"
      - name: NuGet audit
        run: dotnet restore --locked-mode --force -p:EyeDbgNuGetAudit=true

  # Publishes the helper the way release.yml's `helper` job does and keeps it as
  # a run artifact for the `goreleaser` job, which packs it into every archive.
  helper-dist:
    name: helper-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version comes from git describe
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        working-directory: helpers/dotnet
        run: |
          set -euo pipefail
          version=$(git describe --tags --always --dirty)
          dotnet publish src/EyeDbg.DotnetHelper/EyeDbg.DotnetHelper.csproj -c Release -p:RestoreLockedMode=true \
            -p:InformationalVersion="${version#v}" -o artifacts/dist
      - name: Every shipped third-party assembly is in THIRD-PARTY-NOTICES.txt
        run: |
          set -euo pipefail
          dist=helpers/dotnet/artifacts/dist
          test -f "$dist/THIRD-PARTY-NOTICES.txt"
          missing=0
          while IFS= read -r f; do
            name=$(basename "$f")
            [ "$name" = eyedbg-dotnet-helper.dll ] && continue
            if ! grep -qF "$name" helpers/dotnet/THIRD-PARTY-NOTICES.txt; then
              echo "::error::$f ships but helpers/dotnet/THIRD-PARTY-NOTICES.txt doesn't name it"
              missing=1
            fi
          done < <(find "$dist" -type f -name '*.dll')
          exit "$missing"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-helper
          path: helpers/dotnet/artifacts/dist
          if-no-files-found: error
          retention-days: 14

  # Builds the VSIX the same way release.yml's `vsix` job does, and keeps it as
  # a run artifact, so every CI run proves the extension packages and the
  # `goreleaser` job below can prove it lands in checksums.txt.
  vsix:
    name: vsix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: |
          corepack enable
          cd extensions/vscode && pnpm --version
      - name: Install dependencies
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile
      - name: Package
        working-directory: extensions/vscode
        run: pnpm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: extensions/vscode/out/eyedbg.vsix
          if-no-files-found: error
          retention-days: 14

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          online-audits: "false"
          advanced-security: "false"

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  goreleaser:
    name: goreleaser (snapshot, no publish)
    needs: [vsix, helper-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version from tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false # release-shaped job: never restore a cache that a PR could have written
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: extensions/vscode/out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dotnet-helper
          path: helpers/dotnet/artifacts/dist
      - name: Check configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: The VSIX is in checksums.txt
        run: |
          set -euo pipefail
          want=$(sha256sum extensions/vscode/out/eyedbg.vsix | cut -d' ' -f1)
          line=$(grep -E '^[0-9a-f]{64}  eyedebugger_.+_vscode\.vsix$' dist/checksums.txt)
          if [ "$(printf '%s\n' "$line" | wc -l)" -ne 1 ] || [ "${line%% *}" != "$want" ]; then
            echo "::error::dist/checksums.txt doesn't list the VSIX with its sha256"; cat dist/checksums.txt; exit 1
          fi
      - name: Every archive carries the .NET helper
        run: |
          set -euo pipefail
          archives=(dist/eyedebugger_*_{linux,darwin}_{amd64,arm64}.tar.gz dist/eyedebugger_*_windows_{amd64,arm64}.zip)
          [ "${#archives[@]}" -eq 6 ] || { echo "::error::expected 6 archives, found ${#archives[@]}"; exit 1; }
          for a in "${archives[@]}"; do
            if [[ "$a" == *.zip ]]; then list=$(unzip -Z1 "$a"); else list=$(tar -tzf "$a"); fi
            for f in eyedbg-dotnet-helper.dll eyedbg-dotnet-helper.runtimeconfig.json eyedbg-dotnet-helper.deps.json THIRD-PARTY-NOTICES.txt \
              Microsoft.Diagnostics.Runtime.dll; do
              grep -qx "helpers/dotnet/$f" <<<"$list" || { echo "::error::$a lacks helpers/dotnet/$f"; exit 1; }
            done
          done
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: The shipped layout runs (linux_amd64 archive)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/archive"
          mkdir -p "$dir"
          tar -xzf dist/eyedebugger_*_linux_amd64.tar.gz -C "$dir"
          out=$(EYEDBG_RUNTIME_DIR="$RUNNER_TEMP/rt" "$dir/eyedbg" dotnet ps --json)
          echo "$out"
          jq -e '.schema == 1 and (.processes | type == "array")' <<<"$out"

  # Single required status check for branch protection; add new jobs to `needs`.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, build, e2e-matrix, e2e, extension, vsix, helper, helper-dist, workflows, vuln, goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
