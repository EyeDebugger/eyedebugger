# GoReleaser v2 configuration. Docs: https://goreleaser.com/customization/
# Releases run from .github/workflows/release.yml, on a pushed tag. The VS Code
# extension's VSIX must be built first (`task ext:package`) so extra_files below
# find it, and the .NET side helper (`task helper:dist`, into
# helpers/dotnet/artifacts/dist) so every archive carries it: without that
# directory goreleaser fails rather than ship archives lacking the helper. Use
# `task snapshot` (or those two, then `goreleaser release --snapshot --clean`) for a
# local dry run.
version: 2

project_name: eyedebugger

before:
  hooks:
    - go mod download

builds:
  - &build
    id: eyedbg
    main: ./cmd/eyedbg
    binary: eyedbg
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.commit={{ .FullCommit }}
      - -X {{ .ModulePath }}/internal/version.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *build
    id: eyedbgd
    main: ./cmd/eyedbgd
    binary: eyedbgd

archives:
  - id: default
    ids: [eyedbg, eyedbgd]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      # The .NET side helper, built by release.yml's `helper` job. No glob
      # characters: a missing directory is an error, not a silently empty match.
      - src: helpers/dotnet/artifacts/dist
        dst: helpers/dotnet

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files: # the VS Code extension, built before goreleaser runs (release.yml `vsix` job; task snapshot)
    - glob: ./extensions/vscode/out/eyedbg.vsix
      name_template: "{{ .ProjectName }}_{{ .Version }}_vscode.vsix"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  disable: true # CHANGELOG.md (Keep a Changelog) is the source of release notes

release:
  github:
    owner: EyeDebugger
    name: eyedebugger
  prerelease: auto # tags like v0.2.0-rc.1 are marked pre-release
  extra_files: # keep equal to checksum.extra_files
    - glob: ./extensions/vscode/out/eyedbg.vsix
      name_template: "{{ .ProjectName }}_{{ .Version }}_vscode.vsix"
