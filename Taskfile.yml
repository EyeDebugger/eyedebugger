# Developer tasks. Requires Task v3 (https://taskfile.dev); see CONTRIBUTING.md.
# CI (.github/workflows/ci.yml) runs the same commands; keep the two in sync.
version: '3'

vars:
  MODULE: github.com/eyedebugger/eyedebugger
  # Pinned tool versions. Bump together with .github/workflows/ci.yml.
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -X {{.MODULE}}/internal/version.version={{.VERSION}}

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build all binaries for this platform into ./bin, and the .NET side helper into ./bin/helpers/dotnet when dotnet is installed
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/ ./cmd/...
      # A shell `if`, not Task's `if:` key (Task >= 3.48 only).
      - if command -v dotnet >/dev/null 2>&1; then "{{.TASK_EXE}}" helper:build; else echo "dotnet not found; skipped the .NET side helper (eyedbg dotnet needs it; install the .NET 10 SDK)"; fi

  build:cross:
    desc: Compile every package for linux, darwin, windows x amd64, arm64 (CGO disabled)
    env:
      CGO_ENABLED: '0'
    cmds:
      - for:
          matrix:
            OS: [linux, darwin, windows]
            ARCH: [amd64, arm64]
        cmd: GOOS={{.ITEM.OS}} GOARCH={{.ITEM.ARCH}} go build ./...

  test:
    desc: Run unit tests
    cmds:
      - go test -shuffle=on ./...

  test:race:
    desc: Run unit tests with the race detector (needs cgo and a C compiler)
    cmds:
      - go test -race -shuffle=on ./...

  test:golden:
    desc: Rewrite golden files from current output; review the diff before committing
    env:
      EYEDBG_UPDATE_GOLDEN: '1'
    cmds:
      - go test ./...

  e2e:
    desc: Run end-to-end tests against real adapters (needs the .NET SDK + netcoredbg + SharpDbg (eyedbg adapters install sharpdbg), Python 3.10+ + debugpy, cc/c++/rustc + lldb-dap, go + delve); narrow with EYEDBG_E2E_LANGS; pass COUNT=5 before merging an e2e change
    vars:
      COUNT: '{{.COUNT | default "1"}}'
    env:
      EYEDBG_E2E: '1'
    cmds:
      - go test -count={{.COUNT}} -p 1 -timeout 40m ./drivers/... ./internal/e2e/...

  fmt:
    desc: Format code (gofumpt, goimports)
    preconditions:
      - sh: command -v golangci-lint
        msg: golangci-lint not found; install {{.GOLANGCI_LINT_VERSION}} (see CONTRIBUTING.md)
    cmds:
      - golangci-lint fmt

  lint:
    desc: Run golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: golangci-lint not found; install {{.GOLANGCI_LINT_VERSION}} (see CONTRIBUTING.md)
    cmds:
      - golangci-lint run

  vuln:
    desc: Scan for known vulnerabilities with govulncheck
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  lint:workflows:
    desc: Lint GitHub Actions workflow files with actionlint
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff

  release:check:
    desc: Validate .goreleaser.yaml (needs goreleaser v2)
    cmds:
      - goreleaser check

  snapshot:
    desc: Build release archives (with the .NET helper) and the VSIX's checksum into ./dist without publishing (needs goreleaser v2, Node and pnpm, the .NET 10 SDK)
    cmds:
      - task: ext:package
      - task: helper:dist
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin dist helpers/dotnet/artifacts

  # The .NET side helper (helpers/dotnet; docs/adr/0016): the .NET 10 SDK
  # (helpers/dotnet/global.json); every dotnet command runs in helpers/dotnet.
  # Restores are locked to packages.lock.json.
  helper:restore:
    desc: Restore the helper's NuGet packages (locked to the lock files)
    dir: helpers/dotnet
    cmds:
      - dotnet restore --locked-mode

  helper:build:
    desc: Build the .NET side helper into ./bin/helpers/dotnet, next to eyedbg
    dir: helpers/dotnet
    sources:
      - src/**/*
      - "*.props"
      - global.json
      - nuget.config
      - THIRD-PARTY-NOTICES.txt
      - exclude: src/**/bin/**
      - exclude: src/**/obj/**
    generates:
      - ../../bin/helpers/dotnet/eyedbg-dotnet-helper.dll
    cmds:
      - dotnet publish src/EyeDbg.DotnetHelper/EyeDbg.DotnetHelper.csproj -c Release -p:RestoreLockedMode=true -p:InformationalVersion={{trimPrefix "v" .VERSION}} -o ../../bin/helpers/dotnet

  helper:dist:
    desc: Publish the .NET side helper into helpers/dotnet/artifacts/dist for goreleaser
    dir: helpers/dotnet
    cmds:
      - rm -rf artifacts/dist
      - dotnet publish src/EyeDbg.DotnetHelper/EyeDbg.DotnetHelper.csproj -c Release -p:RestoreLockedMode=true -p:InformationalVersion={{trimPrefix "v" .VERSION}} -o artifacts/dist

  helper:test:
    desc: Run the helper's unit tests (xUnit v3)
    dir: helpers/dotnet
    cmds:
      - dotnet run --project tests/EyeDbg.DotnetHelper.Tests -c Release

  helper:fmt:
    desc: Format the helper's C# (dotnet format)
    dir: helpers/dotnet
    cmds:
      - dotnet format

  helper:lint:
    desc: Check the helper's formatting and build it with analyzers as errors
    dir: helpers/dotnet
    cmds:
      - dotnet format --verify-no-changes
      - dotnet build -c Release --no-restore

  helper:vuln:
    desc: Audit the helper's NuGet packages (advisories are errors)
    dir: helpers/dotnet
    cmds:
      - dotnet restore --locked-mode --force -p:EyeDbgNuGetAudit=true

  helper:ci:
    desc: Run the helper checks CI runs
    cmds:
      - task: helper:restore
      - task: helper:lint
      - task: helper:test
      - task: helper:vuln

  # The VS Code extension (extensions/vscode; docs/adr/0015): Node 24 LTS
  # (>= 22.13) and pnpm (corepack enable, or any pnpm >= 11, which switches
  # itself to the version package.json pins). pnpm only: never npm or npx.
  ext:install:
    desc: Install the extension's pinned dev dependencies (frozen lockfile; no install scripts run)
    dir: extensions/vscode
    cmds:
      - pnpm install --frozen-lockfile

  ext:typecheck:
    desc: Type-check the extension (tsc --noEmit)
    dir: extensions/vscode
    cmds:
      - pnpm run typecheck

  ext:lint:
    desc: Lint and format-check the extension (Biome)
    dir: extensions/vscode
    cmds:
      - pnpm run lint

  ext:fmt:
    desc: Format the extension and apply safe lint fixes (Biome)
    dir: extensions/vscode
    cmds:
      - pnpm run fmt

  ext:test:
    desc: Run the extension's unit tests (node --test)
    dir: extensions/vscode
    cmds:
      - pnpm test

  ext:build:
    desc: Bundle the extension into extensions/vscode/dist
    dir: extensions/vscode
    cmds:
      - pnpm run build

  ext:package:
    desc: Package the extension into extensions/vscode/out/eyedbg.vsix and check its file list
    dir: extensions/vscode
    cmds:
      - pnpm run package

  ext:test:integration:
    desc: Run the extension's integration tests in VS Code 1.100.0 and 1.139.0 (downloads VS Code; Linux needs xvfb; EYEDBG_DATA_DIR with debugpy and netcoredbg, the .NET 10 SDK and the .NET helper next to eyedbg, or EYEDBG_TEST_DOTNET=0); pass COUNT=5 before merging an extension change
    dir: extensions/vscode
    env:
      EYEDBG_TEST_COUNT: '{{.COUNT | default "1"}}'
    cmds:
      - pnpm run test:integration

  ext:ci:
    desc: Run the extension checks CI runs (without the integration tests)
    cmds:
      - task: ext:install
      - task: ext:typecheck
      - task: ext:lint
      - task: ext:test
      - task: ext:package

  ci:go:
    desc: Run the Go checks CI runs
    cmds:
      - task: tidy:check
      - task: lint
      - task: test:race
      - task: build:cross
      - task: vuln

  ci:
    desc: Run the checks CI runs (Go, the VS Code extension and the .NET helper; needs Node and pnpm and the .NET 10 SDK — 'task ci:go' for Go only)
    cmds:
      - task: ci:go
      - task: ext:ci
      - task: helper:ci
